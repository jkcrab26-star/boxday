<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0D0730"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE03A"/>
      <stop offset="100%" stop-color="#F7A800"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" rx="44" ry="44" fill="url(#bgGrad)"/>

  <!-- Outer badge hex ring (gold) -->
  <polygon
    points="200,22 364,112 364,288 200,378 36,288 36,112"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="8"
    filter="url(#shadow)"
    opacity="0.9"
  />

  <!-- Inner hex ring (purple) -->
  <polygon
    points="200,42 344,124 344,276 200,358 56,276 56,124"
    fill="none"
    stroke="#7B5CF5"
    stroke-width="3"
    opacity="0.55"
  />

  <!-- Hex interior subtle fill -->
  <polygon
    points="200,50 338,128 338,272 200,350 62,272 62,128"
    fill="#1A0D50"
    opacity="0.5"
  />

  <!-- ── Brain (larger, centered) ── -->
  <!-- Left lobe -->
  <ellipse cx="178" cy="195" rx="50" ry="46" fill="#6D3FD4" opacity="0.95"/>
  <!-- Right lobe -->
  <ellipse cx="222" cy="195" rx="50" ry="46" fill="#6D3FD4" opacity="0.95"/>
  <!-- Bottom connector -->
  <rect x="168" y="200" width="64" height="28" fill="#6D3FD4" opacity="0.95" rx="8"/>

  <!-- Center groove -->
  <line x1="200" y1="154" x2="200" y2="226" stroke="#0D0730" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- Left lobe wrinkles -->
  <path d="M152,183 Q160,170 170,177" stroke="#A78BFA" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M145,198 Q155,185 165,192" stroke="#A78BFA" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M153,213 Q163,202 172,209" stroke="#A78BFA" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Right lobe wrinkles -->
  <path d="M248,183 Q240,170 230,177" stroke="#A78BFA" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M255,198 Q245,185 235,192" stroke="#A78BFA" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M247,213 Q237,202 228,209" stroke="#A78BFA" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- ── Lightning bolt (centered, large) ── -->
  <polygon
    points="212,150 194,200 206,200 188,252 220,200 208,200 224,150"
    fill="url(#goldGrad)"
    filter="url(#glow)"
    stroke="#FFF8C0"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- ── Star sparks ── -->
  <!-- Top-left -->
  <polygon points="80,118 83,109 86,118 95,121 86,124 83,133 80,124 71,121"
    fill="#FFE03A" opacity="0.9" filter="url(#softGlow)"/>
  <!-- Top-right -->
  <polygon points="320,118 323,109 326,118 335,121 326,124 323,133 320,124 311,121"
    fill="#58CFFF" opacity="0.9" filter="url(#softGlow)"/>
  <!-- Bottom-left small -->
  <polygon points="88,282 90,276 92,282 98,284 92,286 90,292 88,286 82,284"
    fill="#FFE03A" opacity="0.75"/>
  <!-- Bottom-right small -->
  <polygon points="312,282 314,276 316,282 322,284 316,286 314,292 312,286 306,284"
    fill="#58CFFF" opacity="0.75"/>

  <!-- Tiny dot sparkles for ADHD energy feel -->
  <circle cx="108" cy="158" r="4" fill="#58CFFF" opacity="0.6"/>
  <circle cx="292" cy="158" r="4" fill="#FFE03A" opacity="0.6"/>
  <circle cx="100" cy="240" r="3" fill="#A78BFA" opacity="0.5"/>
  <circle cx="300" cy="240" r="3" fill="#A78BFA" opacity="0.5"/>
</svg>
